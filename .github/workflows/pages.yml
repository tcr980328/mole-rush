name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare GitHub Pages
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== Build output ====="
          find dist/client -maxdepth 5 -type f | sort | head -200

          rm -rf site
          mkdir -p site

          cp -a dist/client/. site/

          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [ -d "site/$REPO_NAME" ]; then
            echo "===== Flatten $REPO_NAME directory ====="
            cp -a "site/$REPO_NAME/." site/
            rm -rf "site/$REPO_NAME"
          fi

          touch site/.nojekyll

          echo "===== Final Pages files ====="
          find site -maxdepth 5 -type f | sort | head -200

          test -f site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
